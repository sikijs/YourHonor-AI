services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: ghcr.io/sikijs/yourhonor-ai/backend:latest
    ports:
      - "${HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    env_file:
      - ../.env
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/yourhonor.db
      - UPLOAD_DIR=/app/data/uploads
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
