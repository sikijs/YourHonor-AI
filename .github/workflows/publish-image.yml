name: Publish Docker Image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          rm -rf ../backend/app/static/
          cp -r out/. ../backend/app/static/

      - name: Extract image tag
        id: tag
        run: |
          TAG=$(grep -oP 'yourhonor-ai/backend:\K[^"]+' docker/docker-compose.yml)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract app version
        id: ver
        run: |
          VER=$(grep -oP 'APP_VERSION = "\K[^"]+' backend/app/main.py)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          tags: |
            ghcr.io/sikijs/yourhonor-ai/backend:${{ steps.tag.outputs.tag }}
            ghcr.io/sikijs/yourhonor-ai/backend:v${{ steps.ver.outputs.version }}
          push: true
          provenance: false
          sbom: false
