name: Publish Docker Image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          rm -rf ../backend/app/static/
          cp -r out/. ../backend/app/static/

      - name: Extract app version
        id: ver
        run: echo "version=$(python3 -c "with open('backend/app/main.py') as f: print([l.split('\"')[1] for l in f if 'APP_VERSION' in l and '=' in l][0])")" >> "$GITHUB_OUTPUT"
